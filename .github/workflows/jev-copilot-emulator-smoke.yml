name: Jev Chat Copilot — Android emulator smoke test

on:
  push:
    branches: [jev-chat-copilot-mvp]
    paths:
      - '.github/workflows/jev-copilot-emulator-smoke.yml'

permissions:
  contents: read

jobs:
  emulator-smoke:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Build Android debug APK
        run: gradle -p jev-chat-mvp --no-daemon assembleDebug
      - name: Install and launch on Android 11 emulator
        timeout-minutes: 14
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK: $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-30;google_apis;x86_64" "emulator"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n jev_api30 -k "system-images;android-30;google_apis;x86_64" --force
          test -e /dev/kvm
          "$SDK/emulator/emulator" -avd jev_api30 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > /tmp/jev-emulator.log 2>&1 &
          EMU_PID=$!
          trap 'kill "$EMU_PID" || true' EXIT
          adb wait-for-device
          timeout 360 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 3; done'
          adb install -r jev-chat-mvp/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n io.jev.copilot/.MainActivity
          sleep 5
          adb shell pidof io.jev.copilot
          adb shell am start -W -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT 'A: hello' -n io.jev.copilot/.MainActivity
          sleep 4
          adb shell pidof io.jev.copilot
          adb shell uiautomator dump /sdcard/jev_dump.xml
          adb shell cat /sdcard/jev_dump.xml | grep '分享文本'
          echo 'PASS: emulator installed, launched, and displayed imported shared text'
