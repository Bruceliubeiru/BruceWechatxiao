name: Jev Chat Copilot — free public Android build

on:
  push:
    branches: [jev-chat-copilot-mvp]
    paths:
      - 'jev-chat-mvp/**'
      - '.github/workflows/build-jev-copilot.yml'

permissions:
  contents: read

jobs:
  compile:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Verify pure Java analysis core
        run: |
          mkdir -p /tmp/jev-checks
          javac -encoding UTF-8 -d /tmp/jev-checks jev-chat-mvp/app/src/main/java/io/jev/copilot/PromptComposer.java jev-chat-mvp/app/src/test/java/io/jev/copilot/PromptComposerTest.java
          java -cp /tmp/jev-checks io.jev.copilot.PromptComposerTest
      - name: Compile Android debug APK
        run: gradle -p jev-chat-mvp --no-daemon assembleDebug
      - name: Inspect APK
        run: |
          APK=jev-chat-mvp/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep classes.dex
          sha256sum "$APK" | tee jev-chat-mvp/app/build/outputs/apk/debug/SHA256.txt
      - name: Upload test-only APK for one day
        uses: actions/upload-artifact@v4
        with:
          name: jev-copilot-debug-apk-unverified-on-device
          path: |
            jev-chat-mvp/app/build/outputs/apk/debug/app-debug.apk
            jev-chat-mvp/app/build/outputs/apk/debug/SHA256.txt
          retention-days: 1
          if-no-files-found: error
