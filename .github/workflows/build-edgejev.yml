name: Build EdgeJev multilingual INT8

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[edgejev-build-trigger]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EdgeJev builder
        run: |
          python -m pip install --upgrade pip
          pip install "edgejev[build]"

      - name: Build multilingual INT8 model
        env:
          USE_TF: "0"
        run: |
          edgejev build \
            --backend laya \
            --model convaiinnovations/laya-multilingual \
            --out ./jev-int8 \
            --precision int8
          ls -lh ./jev-int8
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("jev-int8")
          rows = []
          for p in sorted(root.iterdir()):
              if p.is_file():
                  h = hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda: f.read(1024*1024), b""):
                          h.update(chunk)
                  rows.append({"file": p.name, "bytes": p.stat().st_size, "sha256": h.hexdigest()})
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          pathlib.Path("jev-int8/SHA256.json").write_text(json.dumps(rows, indent=2), encoding="utf-8")
          PY

      - name: Upload self-contained model
        uses: actions/upload-artifact@v4
        with:
          name: edgejev-laya-multilingual-int8
          path: jev-int8/
          retention-days: 7
          if-no-files-found: error
