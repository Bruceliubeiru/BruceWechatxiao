name: Build Fully Offline EdgeJev APK

on:
  push:
    branches: [offline-apk]
    paths:
      - "android-offline/**"
      - "offline-web/**"
      - ".github/workflows/build-offline-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Bundle browser tokenizer and policy
        working-directory: offline-web
        run: |
          npm install
          npx esbuild browser-entry.mjs --bundle --format=iife --platform=browser --target=chrome100 --outfile=../android-offline/app/src/main/assets/offline-agent.js

      - name: Download verified INT8 model into APK
        uses: actions/download-artifact@v4
        with:
          name: edgejev-laya-multilingual-int8
          path: ./android-offline/app/src/main/assets/model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36422056284

      - name: Verify model files
        run: |
          test -f android-offline/app/src/main/assets/model/model.onnx
          test -f android-offline/app/src/main/assets/model/tokenizer.json
          test -f android-offline/app/src/main/assets/model/edgejev.json
          ls -lh android-offline/app/src/main/assets/model/model.onnx
          du -sh android-offline/app/src/main/assets/model

      - name: Build arm64 APK
        run: gradle -p android-offline assembleDebug --stacktrace

      - name: Verify APK payload
        run: |
          APK=android-offline/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'assets/model/model.onnx'
          unzip -l "$APK" | grep 'assets/model/tokenizer.json'
          ls -lh "$APK"
          sha256sum "$APK" | tee android-offline/app/build/outputs/apk/debug/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: prescript-edgejev-offline-arm64
          path: |
            android-offline/app/build/outputs/apk/debug/app-debug.apk
            android-offline/app/build/outputs/apk/debug/SHA256.txt
          retention-days: 7
          if-no-files-found: error
